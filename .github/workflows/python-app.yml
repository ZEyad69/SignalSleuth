name: SignalSleuth CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test on Python 3.12
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install SignalSleuth
        run: python -m pip install -e ".[dev]"

      - name: Verify package import
        run: python -c "import signalsleuth; print('SignalSleuth installed successfully')"

      - name: Run tests
        run: python -m pytest -v
