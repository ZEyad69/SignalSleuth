
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "signalsleuth"
version = "0.1.0"
description = "A research-oriented toolkit for evaluating time-series anomaly detection methods."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Zeyad Bakr", email = "zbakr2168@gmail.com" }
]

license = "MIT"

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/ZEyad69/SignalSleuth"
Repository = "https://github.com/ZEyad69/SignalSleuth"
Issues = "https://github.com/ZEyad69/SignalSleuth/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
